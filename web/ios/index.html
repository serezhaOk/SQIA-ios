<!doctype html>
<!--
  The bridge, for sqia.serezhaok.com/ios. Copy the whole folder into
  funny-steps/public/ios/ and it ships with the site.

  A directory with an index rather than ios.html, so that the bare path
  /ios resolves on any host. Some serve /ios as /ios.html and some do not,
  and the address is baked into what the server mails out — a link that
  404s is not something you get to fix after the fact.

  Mail clients will not follow sqia://, so a sign-in link cannot point at the
  app directly. It points here instead, and this hands whatever it was given
  straight on. Both halves of the URL are forwarded: some flows put the code
  in the query, some put a whole session in the fragment, and a refusal can
  be in either.

  Nothing is read, stored or sent anywhere. There is no script here beyond
  the redirect, and no way for the page to see a token that the app is not
  about to receive anyway.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Opening SQIA…</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #000;
        color: #f5f3f3;
        font-family: -apple-system, system-ui, sans-serif;
        letter-spacing: -0.01em;
        text-align: center;
        padding: 24px;
      }
      p {
        margin: 0 0 18px;
        font-size: 15px;
      }
      a {
        display: inline-block;
        padding: 14px 26px;
        border-radius: 999px;
        background: #f5f3f3;
        color: #111;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
      }
      small {
        display: block;
        margin-top: 22px;
        color: #8a8a8a;
        font-size: 12.5px;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Opening SQIA…</p>
      <a id="open" href="sqia://auth">Open SQIA</a>
      <small>If nothing happens, tap the button. Use the device you started on.</small>
    </main>
    <script>
      // Query and fragment both, exactly as they arrived.
      var target =
        'sqia://auth' + (location.search || '') + (location.hash || '');
      document.getElementById('open').href = target;
      // A link the user tapped is a gesture, so the redirect is allowed.
      location.replace(target);
    </script>
  </body>
</html>
