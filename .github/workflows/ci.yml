name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The parity suite is pure Swift with no Apple frameworks, so it runs on a
  # Linux container in seconds rather than waiting for a macOS runner.
  core:
    name: Core parity tests
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Test
        working-directory: Core
        run: swift test
      # The render-cost bar only means something against optimised code —
      # unoptimised Swift is several times slower and says nothing about
      # what ships.
      - name: Test (release)
        working-directory: Core
        run: swift test -c release

  app:
    name: Build the app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # The runner's Xcode is usually newer than a developer's, and newer
      # compilers accept things older ones reject — a green build here is
      # only worth something if it is the same toolchain. Printed loudly so
      # a mismatch is visible when a local build fails and this one did not.
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build
        run: |
          # pipefail is load-bearing. Without it the step's exit status is
          # xcbeautify's, and xcbeautify will happily format a failed build
          # and exit zero — so a compile error was reported as a green job.
          # That is not hypothetical: it hid two of them.
          set -o pipefail
          xcodebuild build \
            -project SQIA.xcodeproj \
            -scheme SQIA \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      # The smoke test walks the screens, which is the one thing the Linux
      # suite cannot do: every one of its tests would still pass with a view
      # wired to the wrong model. Needs a named simulator rather than the
      # generic destination, because a test has to actually boot something.
      # The smoke test walks the screens, which is the one thing the Linux
      # suite cannot do: every one of its tests would still pass with a view
      # wired to the wrong model.
      - name: Pick a simulator
        id: sim
        run: |
          # Runner images change their line-up without notice — this one
          # carries iPhone 17s where the workflow was first written against
          # an iPhone 16. Ask the runner rather than naming a model that
          # will rot again, and go by udid so the answer cannot be
          # ambiguous.
          xcrun simctl list devices available -j > /tmp/sims.json
          python3 - <<'PICK' >> "$GITHUB_OUTPUT"
          import json
          runtimes = json.load(open("/tmp/sims.json"))["devices"]
          for runtime in sorted(runtimes, reverse=True):
              for device in runtimes[runtime]:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      print(f"udid={device['udid']}")
                      print(f"name={device['name']}")
                      raise SystemExit
          raise SystemExit("no iPhone simulator on this runner")
          PICK

      # Serially, on the simulator picked above rather than on clones of it.
      # Every smoke failure so far has been a clone that would not start —
      # `Failed to launch com.serezhaok.sqia.uitests.xctrunner`, or a
      # DTServiceHub that could not resume the process it had just launched —
      # and not one assertion among them. Five tests do not need the
      # parallelism, and cloned simulators on a loaded runner evidently
      # cannot be relied on to boot.
      - name: Smoke test on ${{ steps.sim.outputs.name }}
        run: |
          set -o pipefail
          xcodebuild test \
            -project SQIA.xcodeproj \
            -scheme SQIA \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee /tmp/xcodebuild.log | xcbeautify

      # xcbeautify's summary names the failing test and says how long it took,
      # and nothing else — not the assertion, not a crash, not a simulator
      # that refused to launch the runner. That is enough to know something
      # is wrong and not enough to fix it, and there is no second chance at
      # the log once the runner is gone. Keep the raw output and print the
      # lines that say why.
      - name: Why the smoke test failed
        if: failure()
        run: |
          grep -n -E \
            "error:|XCTAssert|Assertion Failure|Fatal error|Restarting after|Interruption|did not|never appeared|went away|Failed to|Timed out" \
            /tmp/xcodebuild.log | tail -80 || echo "nothing matched in the raw log"

  # The fixtures are generated from the web app's sources. If those change,
  # the iOS port is being measured against stale data — worth knowing about,
  # but not worth blocking a build over, so this reports without failing.
  fixtures:
    name: Fixtures still match the web
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          path: ios
      - uses: actions/checkout@v4
        with:
          repository: serezhaOk/funny-steps
          path: funny-steps
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate and diff
        working-directory: ios/tools/gen-fixtures
        env:
          WEB_SRC: ${{ github.workspace }}/funny-steps/src
        run: |
          node --run gen
          cd "$GITHUB_WORKSPACE/ios"
          if ! git diff --quiet -- Core/Tests/SQIACoreTests/Fixtures; then
            echo "::warning::Fixtures differ from the current web sources — regenerate and re-run the parity suite."
            git diff --stat -- Core/Tests/SQIACoreTests/Fixtures
            exit 1
          fi
          echo "Fixtures are current."
